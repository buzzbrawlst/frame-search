<!doctype html>
<html><head><meta charset="utf-8"><title>Frame Search Settings</title><style>body{margin:0;background:#0c0c0f;color:#eee;font:14px system-ui,sans-serif}main{max-width:620px;margin:50px auto;padding:0 24px}h1{font-size:28px}section{background:#15151a;border:1px solid #29292f;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:14px 0 7px;font-weight:650}input{width:100%;padding:10px;border-radius:9px;border:1px solid #333;background:#0d0d10;color:#fff}p{color:#999;line-height:1.6}a{color:#fff}</style></head>
<body><main><h1>Frame Search</h1><p>Capture anything visible and send it straight to Google Lens.</p>
<section><label for="quality">Screenshot JPEG quality</label><input id="quality" type="number" min="50" max="100" step="1"><p>Higher quality gives Lens more detail but creates a larger upload.</p></section>
<section><b>Keyboard shortcuts</b><p>Full capture: <b>Ctrl + Shift + L</b><br>Select region: <b>Ctrl + Shift + K</b></p><p>Chrome lets you change these at <a href="chrome://extensions/shortcuts">extension shortcuts</a>.</p></section>
<script src="options.js"></script></main></body></html>
